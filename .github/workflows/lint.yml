name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A main push skips lint only when this exact tree already passed it on a
  # same-repository pull request (.github/scripts/ci-reuse.cjs).
  reuse:
    name: Reuse pull request result
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.reuse.outputs.tested }}
    steps:
      - uses: actions/checkout@v5

      - name: Reuse the pull request result for an identical tree
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-reuse.cjs check

  lint:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: CI reuse policy
        run: node --test .github/scripts/ci-reuse.test.cjs

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "PHP clean"

      - name: Stabilization contract
        run: php tests/dispatch-stabilization-contract.php

      - name: Journal voice runtime
        run: |
          php tests/journal-voice-runtime.php
          php tests/openai-cost-guard-runtime.php
          php tests/dispatch-claude-voice-runtime.php

      - name: Journal integration runtime
        run: |
          php tests/dispatch-integration-runtime.php
          php tests/dispatch-worker-runtime.php
          php tests/dispatch-pitches-runtime.php
          php tests/dispatch-foundation-dependency-runtime.php
          php tests/dispatch-foundation-ownership-runtime.php
          php tests/dispatch-source-ownership-runtime.php
          php tests/dispatch-site-studio-runtime.php
          php tests/source-reader-runtime.php
          php tests/source-radar-bridge-runtime.php

      - name: JS syntax
        run: |
          set -e
          find . -name '*.js' -not -path './node_modules/*' -not -path './vendor/*' -print0 \
            | while IFS= read -r -d '' f; do node --check "$f"; done
          echo "JS clean"

      - name: CSS brace balance
        run: |
          python3 - <<'PYEOF'
          import glob, sys
          bad = []
          for f in glob.glob('**/*.css', recursive=True):
              s = open(f, encoding='utf-8', errors='ignore').read()
              if s.count('{') != s.count('}'):
                  bad.append(f)
          if bad:
              print('Unbalanced braces:', bad)
              sys.exit(1)
          print('CSS balanced')
          PYEOF

      - name: Public geometry policy and rendered block behavior
        run: |
          npm ci --ignore-scripts
          npm run test:geometry

      # Lets the merge to main reuse this result (.github/scripts/ci-reuse.cjs).
      - name: Name the fully tested tree
        if: github.event_name == 'pull_request'
        run: |
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/tested-tree.txt"

      - name: Record the fully tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: ci-passed-tree-${{ env.TESTED_TREE }}
          path: ${{ runner.temp }}/tested-tree.txt
          retention-days: 14
          overwrite: true
          if-no-files-found: error
